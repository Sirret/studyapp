<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<link rel="icon" href="%sveltekit.assets%/icons/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="%sveltekit.assets%/icons/icon-192.png" sizes="192x192" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/icon-192.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/nunito-latin-wght-normal.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<script>
			// The theme before the app starts, so the page never flashes the wrong one (DESIGN §3.1).
			try {
				var hint = localStorage.getItem('snowpack.theme');
				document.documentElement.dataset.theme =
					hint === 'dark' || hint === 'light'
						? hint
						: matchMedia('(prefers-color-scheme: dark)').matches
							? 'dark'
							: 'light';
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
