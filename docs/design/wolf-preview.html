<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yuki — wolf companion reference</title>
<style>
:root{--bg:#FBF7F0;--surface:#FFFDF9;--text:#2B2540;--muted:#6B6482;--primary:#6B5BC9;--soft:#E9E4FB;--peach:#F29E6D}
.dark{--bg:#1B1830;--surface:#26223F;--text:#F3EFFF;--muted:#B7AFD6;--primary:#A99BFF;--soft:#312B52}
body{margin:0;font-family:system-ui,sans-serif;background:#ece7df;color:#2B2540}
section{background:var(--bg);color:var(--text);padding:20px 16px 28px}
h1{font-size:20px;margin:0 0 4px} p{margin:0 0 16px;color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{margin:0;background:var(--surface);border-radius:20px;padding:12px;box-shadow:0 1px 2px rgba(43,37,64,.06),0 6px 18px rgba(43,37,64,.08);text-align:center}
.dark .card{box-shadow:none;border:1px solid #3a3460}
.dark .wolf{filter:drop-shadow(0 0 10px rgba(169,155,255,.35))}
.wolf{width:120px;height:120px;overflow:visible}
figcaption{display:flex;flex-direction:column;gap:2px;font-size:12px} figcaption span{color:var(--muted)}
.wolf *{transform-box:fill-box}
#tail{transform-origin:10% 90%;animation:sway 2.8s ease-in-out infinite}
#body,#head{transform-origin:50% 100%;animation:breathe 3.2s ease-in-out infinite}
#eyes{transform-origin:50% 50%;animation:blink 5s infinite}
.eyes-happy,.eyes-closed,.sparkles,.zzz{display:none}
.s-happy #eyes{display:none} .s-happy .eyes-happy,.s-happy .sparkles{display:inline}
.s-happy .wolf{animation:hop 1.1s cubic-bezier(.3,1.6,.5,1) infinite}
.s-happy .sparkles{transform-origin:50% 50%;animation:twinkle 1.1s ease-in-out infinite}
.s-oops #ear-l{transform-origin:80% 90%;animation:droopL 2.4s ease-in-out infinite}
.s-oops #ear-r{transform-origin:20% 90%;animation:droopR 2.4s ease-in-out infinite}
.s-oops #head{transform-origin:50% 90%;animation:tilt 2.4s ease-in-out infinite}
.s-think #head{transform-origin:50% 90%;animation:think 2.6s ease-in-out infinite}
.s-think #ear-r{transform-origin:20% 90%;animation:twitch 2.6s ease-in-out infinite}
.s-sleepy #eyes{display:none} .s-sleepy .eyes-closed,.s-sleepy .zzz{display:inline}
.s-sleepy #body,.s-sleepy #head{animation-duration:4.8s}
.s-sleepy .zzz{animation:float 3s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.025)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes hop{0%,60%,100%{transform:translateY(0)}25%{transform:translateY(-14px)}}
@keyframes twinkle{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
@keyframes droopL{0%,15%,85%,100%{transform:rotate(0)}35%,65%{transform:rotate(-22deg)}}
@keyframes droopR{0%,15%,85%,100%{transform:rotate(0)}35%,65%{transform:rotate(22deg)}}
@keyframes tilt{0%,15%,85%,100%{transform:rotate(0)}35%,65%{transform:rotate(-6deg)}}
@keyframes think{0%,100%{transform:rotate(0)}40%,70%{transform:rotate(8deg)}}
@keyframes twitch{0%,60%,100%{transform:rotate(0)}65%{transform:rotate(-12deg)}70%{transform:rotate(4deg)}}
@keyframes float{0%,100%{transform:translateY(0);opacity:.6}50%{transform:translateY(-6px);opacity:1}}
.strip{margin-top:18px;background:var(--surface);border-radius:20px;padding:14px 16px}
.track{position:relative;height:10px;border-radius:999px;background:var(--soft);margin:34px 6px 6px}
.fill{height:100%;width:62%;border-radius:999px;background:var(--primary)}
.runner{position:absolute;left:62%;bottom:2px;transform:translateX(-50%);width:44px;height:44px}
.runner .wolf{width:44px;height:44px;animation:trot .5s ease-in-out infinite}
.moon{position:absolute;right:-6px;bottom:-4px;width:18px;height:18px;border-radius:50%;background:#F2C14E;box-shadow:-4px -2px 0 0 var(--surface) inset}
@keyframes trot{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
