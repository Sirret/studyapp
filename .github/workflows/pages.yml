# Builds the app and publishes it to GitHub Pages at https://sirret.github.io/studyapp/
# on every push to main (or by hand from the Actions tab).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build for the /studyapp sub-path
        run: npm run build
        env:
          BASE_PATH: /studyapp

      # .nojekyll: Jekyll would drop the _app/ folder. 404.html: Pages serves it for deep links
      # (e.g. /studyapp/planner), and the SPA routes from there.
      - name: Prepare Pages files
        run: |
          touch build/.nojekyll
          cp build/index.html build/404.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
